name: 'TC-04 Long press 3 s'
version: 1
author: 'QA'

steps:
  - wait-serial: 'GPIO18 -> INTERRUPT -> ISR -> DEBOUNCE -> EVENT'
  - delay: 500ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 1
  - delay: 3000ms
  - set-control:
      part-id: btn1
      control: pressed
      value: 0
  - delay: 3000ms
  # Expected: 1 LOGICAL EVENT, 1 RELEASE
